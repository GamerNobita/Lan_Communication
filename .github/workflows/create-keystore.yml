name: Create signing key (run once)

on:
  workflow_dispatch:

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -keystore upload-keystore.jks \
            -alias lan -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=LAN Messenger, O=Personal, C=BD"
          {
            echo "KEYSTORE_PASSWORD:"
            echo "$PASS"
            echo
            echo "KEYSTORE_BASE64:"
            base64 -w 0 upload-keystore.jks
            echo
          } > secrets.txt

      - uses: actions/upload-artifact@v4
        with:
          name: signing-secrets
          path: secrets.txt
          retention-days: 1
