name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          flutter create --platforms=android --org com.example --project-name lan_messenger build_tmp
          cp -r build_tmp/android ./android
          rm -rf build_tmp

      - name: Add network permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in INTERNET ACCESS_WIFI_STATE CHANGE_WIFI_MULTICAST_STATE ACCESS_NETWORK_STATE; do
            sed -i "/<manifest /a <uses-permission android:name=\"android.permission.$P\"/>" $M
          done
          head -n 12 $M

      - name: Add MulticastLock code to MainActivity
        run: |
          MAIN=$(find android/app/src/main -name 'MainActivity.kt')
          PKG=$(grep -m1 '^package' "$MAIN" | sed 's/package //')
          cat > "$MAIN" <<EOF
          package $PKG

          import android.content.Context
          import android.net.wifi.WifiManager
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private var lock: WifiManager.MulticastLock? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "lan_messenger/multicast")
                      .setMethodCallHandler { call, result ->
                          val wifi = applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                          when (call.method) {
                              "acquire" -> {
                                  if (lock == null) {
                                      lock = wifi.createMulticastLock("lan_messenger")
                                      lock?.setReferenceCounted(false)
                                  }
                                  lock?.acquire()
                                  result.success(true)
                              }
                              "release" -> {
                                  lock?.let { if (it.isHeld) it.release() }
                                  result.success(true)
                              }
                              else -> result.notImplemented()
                          }
                      }
              }
          }
          EOF

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: lan-messenger-apk
          path: build/app/outputs/flutter-apk/app-release.apk
